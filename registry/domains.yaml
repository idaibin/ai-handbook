    capabilities:
      - writing
      - image
      - photography
      - design
      - video
      - animation
      - comic
      - audio

  - id: ai-knowledge-intelligence
    name: AI Knowledge & Intelligence
    status: active-classification
    successor_map: knowledge-intelligence-system-map

    capabilities:
      - agent
      - skills
      - plugins
      - mcp
      - workflow
      - harness
      - evaluation

  - id: ai-creative-media
    name: AI Creative & Media
    status: retained-classification
    successor_maps:
      - content-output-system-map
      - media-production-system-map

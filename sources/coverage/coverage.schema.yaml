$schema: "https://json-schema.org/draft/2020-12/schema"
title: "AI Knowledge Engineering fixed-commit source coverage"
type: object
additionalProperties: false
required: [format_version, batch_id, checked_at, evidence_policy, sources]
properties:
  format_version: {enum: ["canonical-v2", "legacy-v1"]}
  batch_id: {type: string, minLength: 1}
  checked_at: {type: string, minLength: 1}
  evidence_policy: {type: object, minProperties: 1}
  sources:
    type: array
    minItems: 1
allOf:
  - if: {properties: {format_version: {const: "canonical-v2"}}}
    then:
      properties:
        sources:
          items: {$ref: "#/$defs/canonicalSource"}
  - if: {properties: {format_version: {const: "legacy-v1"}}}
    then:
      properties:
        sources:
          items:
            oneOf:
              - $ref: "#/$defs/legacySource"
              - $ref: "#/$defs/legacyRecord"
$defs:
  identity:
    type: object
    required: [source_id, repo, commit_sha]
    properties:
      source_id: {type: string, minLength: 1}
      repo: {type: string, pattern: "^[^/\\s]+/[^/\\s]+$"}
      commit_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
  canonicalSource:
    type: object
    additionalProperties: false
    required: [source_id, repo, commit_sha, records]
    properties:
      source_id: {type: string, minLength: 1}
      repo: {type: string, pattern: "^[^/\\s]+/[^/\\s]+$"}
      commit_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
      records:
        type: array
        minItems: 1
        items:
          allOf:
            - $ref: "#/$defs/identity"
            - $ref: "#/$defs/record"
  legacySource:
    type: object
    additionalProperties: false
    required: [source_id, repo, commit_sha, records]
    properties:
      source_id: {type: string, minLength: 1}
      repo: {type: string, pattern: "^[^/\\s]+/[^/\\s]+$"}
      commit_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
      # Retained only because allowlisted legacy-v1 batches use YAML anchors here.
      document_identity: {$ref: "#/$defs/identity"}
      records:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/record"}
  legacyRecord:
    allOf:
      - $ref: "#/$defs/identity"
      - $ref: "#/$defs/record"
  record:
    type: object
    additionalProperties: false
    required: [role, status]
    properties:
      source_id: {type: string, minLength: 1}
      repo: {type: string, pattern: "^[^/\\s]+/[^/\\s]+$"}
      commit_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
      role:
        type: string
      status:
        enum: [read_at_fixed_commit, not_found, read]
      path: {type: string, minLength: 1}
      git_blob_sha: {type: string, pattern: "^[0-9a-f]{40}$"}
      locator: {type: string, minLength: 1}
      coverage: {type: string, minLength: 1}
      atomic_claims: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      boundaries_or_counterexamples: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      not_verified: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      search_evidence:
        type: object
        additionalProperties: false
        required: [commit, method_or_query, searched_paths_or_tree, result, gap]
        properties:
          commit: {type: string, pattern: "^[0-9a-f]{40}$"}
          method_or_query: {type: string, minLength: 8}
          searched_paths_or_tree: {type: array, minItems: 1, items: {type: string, minLength: 2}}
          result: {type: string, minLength: 8}
          gap: {type: string, minLength: 8}
    allOf:
      - if: {properties: {status: {const: read_at_fixed_commit}}}
        then:
          required: [path, git_blob_sha, locator, coverage, atomic_claims, boundaries_or_counterexamples, not_verified]
      - if: {properties: {status: {const: not_found}}}
        then:
          required: [search_evidence]

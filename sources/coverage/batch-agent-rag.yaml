    locator: "# Agents; ## Basic configuration; ## Multi-agent system design patterns; ## Tool use behavior"
    coverage: "Read the Agent/Runner definition, configuration table, manager-versus-handoff patterns, and tool-result loop controls."
    atomic_claims:
      - "A plain Agent is an LLM configured with instructions, tools, and optional handoffs, guardrails, or structured outputs; Runner owns the turn/tool/handoff/session loop."
      - "Manager-as-tools retains a central conversation owner, whereas a handoff transfers conversation control to a specialist."
      - "Tool output can re-enter the LLM loop or terminate it, depending on tool_use_behavior."
    boundaries_or_counterexamples:
      - "The guide says to use the Responses API directly when the caller must own the orchestration loop."
      - "Offering a tool does not guarantee that an LLM will call it; forcing tool choice carries its own loop constraints."
    not_verified:
      - "Correctness of a multi-agent decomposition for any particular task."


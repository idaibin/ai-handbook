    git_blob_sha: "5caa814c3e9abdd7385bd2ac457eae7d9b859e52"
    locator: "# Guardrails; ## Workflow boundaries; ## Execution modes; ## Tool guardrails"
    coverage: "Read agent-level input/output timing, parallel versus blocking behavior, and tool-guardrail applicability."
    atomic_claims:
      - "Agent input guardrails run only on the first agent and output guardrails only on the final agent; function-tool guardrails run around each configured function-tool invocation."
      - "Parallel input guardrails improve latency but may permit model work or tool execution before cancellation; blocking mode runs before the agent."
      - "The documented tool-guardrail pipeline does not cover handoffs, hosted tools, built-in execution tools, or Agent.as_tool directly."
    boundaries_or_counterexamples:
      - "A guardrail tripwire is a control-flow check, not evidence that an LLM safety classifier is accurate."
      - "Agent-level guardrails alone do not surround every tool call in a delegated workflow."
    not_verified:
      - "Coverage against prompt injection or project-specific side effects."


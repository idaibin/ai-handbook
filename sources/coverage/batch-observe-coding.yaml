format_version: legacy-v1
batch_id: batch-observe-coding-v1
checked_at: "2026-07-31"
evidence_policy:
  method: "Each entry was read from the named GitHub repository through the Contents API at the pinned commit. git_blob_sha is the API-returned blob identifier."
  status_meaning:
    read: "The cited path and locator were read; claims are limited to that material."
    not_found: "No suitable file was found after the recorded search scope; it is not evidence of absence from external docs or runtime behavior."
  exclusions:
    - "README links, repository stars, and workflow filenames are not treated as proof of runtime or production behavior."
    - "No external SaaS account, deployment, benchmark run, or browser automation was performed in this reading batch."

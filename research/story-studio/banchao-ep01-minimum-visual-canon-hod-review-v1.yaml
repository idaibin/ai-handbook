cross_department_findings:
  directing: Ban Chao and Ban Mother provide useful restrained performance components. Ban Gu and the unnamed scribe references repeat the protagonist’s writing action and weaken role differentiation.
  historical_research: All images remain fictional candidates. Generic period mood cannot be converted into exact clothing, room, furniture, document or biography claims.
  production_design: 'The reference set and prop images overuse generic “ancient study” cues: grid windows, blinds, dense shelving, ornate furniture, paper/codex stacks and decorative containers. The approved Composite Set requires far less detail.'
  cinematography: All portrait references are 2:3, not 9:16 scene frames, and mostly repeat the same desk close-up rather than provide coverage. The mother reference reverses the key-light side relative to the male references.
  lighting: Low-key side light is useful as mood, but shared-scene key direction is inconsistent. Official desk and pouch references contain significant crushed blacks and need readability tests.
  costume_hair_makeup: The blueprints are structurally useful but share patterned robes, ribbons and footwear, flattening character hierarchy. They need a plain matte Costume Plot and simpler hair silhouettes.
  props: Writing reference mixes incompatible/ambiguous materials and pseudo-text. Hero Brush, Writing Surface and Brush Pouch must be split into controlled model sheets.
  continuity: Blueprints contain handheld props and accessories that create avoidable state drift. Base turnarounds should be neutral and prop-free.
  vfx: Wholesale reuse would create high cleanup costs for pseudo-text, modern/late-period cues, props and architecture. Replacement is cheaper than repair for five rejected assets.
  editorial: The assets do not prove screen geography, blocking, eyelines or shot rhythm. They cannot substitute for Storyboard/Previs/Animatic.
  rights: Exact model and usage/publication rights remain unknown; no selected component is publication-ready.

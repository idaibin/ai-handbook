asset_contracts:
  hero_brush:
    asset_id: PROP_HERO_BRUSH
    asset_geometry:
      one_fixed_construction: true
      shaft: plain wood or bamboo appearance; continuous straight shaft
      bristle: soft tapered hair tuft with visible fibre character and flexible convergence
      joint: non-metallic transition; no modern ferrule appearance
    hand_contact_points:
      contact_zone: stable lower-middle shaft zone
      grip_goal: vertical/oblique brush control, not modern pencil-like pinch at the extreme tip
      historical_named_grip_claim: NOT_CLAIMED
    failure_conditions:
    - ring or loop on working end or tail
    - hard plastic cone / marker / fountain-pen nib appearance
    - metal ferrule
    - shaft length or diameter morphing
    - bristles fused into a rigid solid cone
  writing_surface:
    asset_id: PROP_WRITING_SURFACE
    asset_geometry:
      fixed_position: true
      stable_plane: true
      no unexplained paper or slip movement: true
    text_policy:
      video_generation: low-contrast nonsemantic ink marks only
      readable_han_text: DETERMINISTIC_POST_COMPOSITE_ONLY
      pseudo_text: FAIL
  laydown_target:
    asset_role: BRUSH_LAYDOWN_ZONE
    implementation: clear dry zone on the existing low writing desk / approved set surface
    dedicated_prop_id: null
    PROP_BRUSH_REST_status: NOT_AUTHORIZED_NOT_VERIFIED
    reason: The active screenplay and current canonical asset list do not include PROP_BRUSH_REST; a historical rest form
      must not be silently introduced.
hand_choreography:
  K1:
    name: NORMAL_WRITING
    start_state: brush tip touches writing surface; hand controls fixed shaft
    end_state: writing slows; no geometry change
  K2:
    name: TIP_LEAVES_SURFACE
    start_state: K1
    action_path: wrist lifts slightly; tip separates vertically from the surface
    end_state: tip visibly clear of surface; no new mark
  K3:
    name: HORIZONTAL_TRANSFER
    start_state: K2
    action_path: hand moves brush toward the approved laydown zone; tip remains suspended
    end_state: shaft nearly horizontal above target; no contact yet
  K4:
    name: SHAFT_CONTACT_AND_RELEASE_START
    start_state: K3
    contact_target: BRUSH_LAYDOWN_ZONE
    action_path: shaft settles on stable dry surface; fingers begin to open
    release_condition: shaft is supported without rolling; tip does not touch writing surface
    end_state: support established; partial finger separation
  K5:
    name: HAND_DETACHED_AND_DECISION
    start_state: K4
    action_path: fingers fully open; hand withdraws; protagonist looks toward the established outward/west direction
    release_condition: no hand-brush contact remains
    end_state: brush static, hand clear, writing does not resume, decision gaze locked
clip_plan:
  Clip_A:
    duration_seconds: 3
    states:
    - K1
    - K2
    task: writing decelerates and stops
  Clip_B:
    duration_seconds: 4
    states:
    - K2
    - K3
    - K4
    task: move brush and establish supported release
  Clip_C:
    duration_seconds: 3
    states:
    - K4
    - K5
    task: hand withdraws and gaze resolves
acceptance_tests:
- character identity stable
- hand anatomy stable
- hero brush construction stable
- bristle form flexible and consistent
- contact and release states physically explicit
- writing surface stable
- no readable pseudo-text
- background motion bounded
- no platform watermark in delivery derivative
- native resolution recorded without relabeling
- full video decode pass
invalidates_on:
- active screenplay beat change
- PROP_HERO_BRUSH canonical geometry change
- PROP_WRITING_SURFACE geometry change
- approved set/desk geometry change

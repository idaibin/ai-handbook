decisions:
- flag_id: writing_batch_format
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_IHP_BINDING_REPLICA
  - SRC_IHP_LIFECYCLE
  - SRC_IHP_77_SLIP_VOLUME
  evidence_conclusion: Han texts could be assembled as cord-bound slip volumes, but “还差两卷” does not identify an exact physical
    batch size or binding stage.
  production_rule: 'Represent the remaining work as exactly two visually distinct work units: one small tied slip fascicle
    and one unfinished aligned group. They communicate workload, not two modern books or a proven historical commission format.
    No readable writing.'
  department_notes:
    writing_story: Keep the dialogue as dramatic compression [A]; do not add a narrator claim about book manufacture.
    props: Use one controlled fascicle silhouette and one unfinished group; record counts and cord state in the Prop Continuity
      Log.
    cinematography: Show in a brief insert or edge-of-frame composition; avoid a didactic inventory shot.
    editorial: The two units support the pressure beat in SHOT_04 and must not create a new explanatory scene.
    vfx: Remove pseudo-text and accidental extra bundles.
- flag_id: official_space_architecture
  decision: closed
  disposition: excluded_from_frame
  evidence_refs:
  - SRC_MET_EASTERN_HAN_HOUSE
  evidence_conclusion: General Eastern Han architecture is evidenced, but no source in this package supports a specific Lan
    Terrace office interior.
  production_rule: 'Do not show or reconstruct the official room. SHOT_11–13 use a shallow abstract work zone: tabletop/low
    working plane, controlled neutral wall or darkness, and ordered negative space. No palace markers, plaque, courtyard,
    window system or complete floor plan.'
  department_notes:
    production_design: Treat the official sequence as a minimal set extension, not a new location build.
    cinematography: Use match framing and shallow depth to keep architecture out of frame.
    lighting: Differentiate status through cleaner controlled light and negative space, not decorative practicals.
    vfx: No macro architecture extension; cleanup only.
- flag_id: official_desk_form
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_IHP_LIFECYCLE
  evidence_conclusion: General Han writing practice supports a low working context, but the exact Lan Terrace desk form is
    not evidenced.
  production_rule: Use the same low working-plane geometry as the labour desk so the editorial Match Cut reads; the official
    version is cleaner, less worn and more ordered. Do not show legs, joinery, ornate lacquer, carved motifs or rank-coded
    furniture.
  department_notes:
    production_design: Create one minimal low-plane model sheet with labour and official surface states.
    props: Surface wear, edge profile and document placement are the only controlled differences.
    editorial: SHOT_10→11 match on brush/hand/work-plane geometry; SHOT_12 removes personal occupancy rather than staging
      a ceremony.
    lighting: Keep edge readability without turning the desk into a product shot.
- flag_id: official_document_material
  decision: closed
  disposition: resolved_by_evidence
  historical_claim_scope: general_han_official_document_handling_only
  biographical_document_verified: false
  evidence_refs:
  - SRC_IHP_77_SLIP_VOLUME
  - SRC_IHP_SEALING_STRIPS
  - SRC_IHP_SEALING_SLIPS_MATERIALS
  - SRC_IHP_LIFECYCLE
  evidence_conclusion: Han official records, bound wooden-slip volumes, cords and sealing strips are directly evidenced; the
    exact appointment or dismissal document for Ban Chao is not.
  production_rule: Use a generic bound wooden-slip packet and/or one sealing strip as an unreadable official-document cue.
    No appointment text, dismissal reason, names, seal legend or readable pseudo-history. The sealing strip may be present
    but its impression remains indistinct.
  department_notes:
    props: Build one controlled generic official packet with fixed cord and sealing-strip state.
    historical_research: Label the asset general Han official document handling, never “Ban Chao appointment document”.
    cinematography: Avoid close focus on seal or text; the object supports status transition only.
    continuity: Record bound/unbound, cord, strip and desk position across SHOT_11–13.
    vfx: Remove readable marks and duplicated seals.
- flag_id: doorway_architecture
  decision: closed
  disposition: excluded_from_frame
  evidence_refs:
  - SRC_SMITHSONIAN_HAN_GATE_MODEL
  - SRC_AIC_HAN_TOMB_DOORS
  evidence_conclusion: Han gate and tomb-door analogues exist, but they do not justify a specific ordinary interior doorway
    for EP01.
  production_rule: The doorway itself stays mostly out of frame. Use only a plain vertical timber edge, threshold shadow and
    motivated light boundary for Ban Gu’s door-side silhouette. No grid lattice, decorative door leaf, studs, painted lintel,
    gatehouse or measured reconstruction.
  department_notes:
    production_design: Define a camera-facing threshold cheat, not a full architectural asset.
    cinematography: Use the edge as a compositional frame and eyeline anchor; preserve the 180-degree line.
    lighting: The threshold motivates the side-light direction without revealing a speculative opening system.
    continuity: Lock edge side, shadow direction and Ban Gu mark for SHOT_05/06/09/13.

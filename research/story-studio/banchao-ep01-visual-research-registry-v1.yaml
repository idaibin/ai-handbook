  - SRC_MET_EASTERN_HAN_HOUSE
  department_notes:
    production_design: Set Plan 只画 A工作区/B同僚区/C家庭阈限区，不标注真实班氏住宅或官署名称。
    cinematography: 以中近景、插入镜头和有限景深减少未经证实的建筑曝光；建立镜头只说明劳动空间，不做城市复原。
    lighting: 使用 motivated soft side light，光源保持画外；可用 negative fill 塑造手部与面部，不显示不受支持的窗式。
    vfx: 仅做 invisible cleanup、伪文字和现代元素清理；不得扩建宏大洛阳背景。

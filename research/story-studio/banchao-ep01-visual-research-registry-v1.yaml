  research_scope: 东汉早期普通室内可见构件与必须抽象的后世定式
  decision_basis: 时代建筑模型可支持“东汉普通建筑体量”的宽泛参照，但没有证据复原洛阳佣书室内。
  production_rule: 采用 composite_set（复合布景）和低细节普通室内：只锁定工作案、人物动线、一个画外/边缘采光开口；不锁定完整平面、斗拱、等级屋顶、彩画、宫殿陈设或具体洛阳建筑。
  evidence_refs:

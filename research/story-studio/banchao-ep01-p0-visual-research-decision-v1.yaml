  decision: closed
  disposition: resolved_by_evidence
  evidence_refs:
  - SRC_IHP_HAN_WRITING_BRUSH
  - SRC_IHP_HAN_WRITING_EQUIPMENT
  historical_claim_scope: general_han_brush_form_only
  biographical_ownership_verified: false
  evidence_conclusion: 有明确年代的汉代出土毛笔提供约23厘米木杆、夹毫缚扎髹漆的实物参照，可建立生产安全的通用形制；不证明班超持有同型笔。
  production_rule: Hero Brush v1 采用细长木质笔杆、约23厘米比例参照、简洁笔头连接和低装饰表面；禁止现代金属箍、塑料件、钢笔/铅笔结构、夸张书法大笔或可识别品牌。
  department_notes:
    props: 建立 Hero Prop model sheet、scale reference、磨损状态和可替换副本版本。
    director: SHOT_10 的“放下—拾起—不再落字”需要 hand choreography，笔的位置和旋转必须可连续。
    cinematography: Macro/insert 使用短景深但保持笔尖、手指和接触点可读；不把镜头变成器物广告。
    continuity: 记录笔尖朝向、墨量、手部位置、案面落点和每个 take 的动作阶段。
- flag_id: brush_pouch_material
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_HHS47_BAN_CHAO
  - SRC_IHP_HAN_WRITING_BRUSH
  evidence_conclusion: 当前来源不能证明东汉存在与候选图相同的标准“笔囊”材质和闭合方式；该物件主要是全片连续性与主题锚点。
  production_rule: 保留 PROP_BRUSH_POUCH 作为明确的[A/V] continuity prop：视觉实现为无装饰、低辨识度、柔软包裹/套状容器；不锁定皮革、金属扣、刺绣、流苏或标准制式，不宣传为东汉标准文具。
  department_notes:
    props: 建立 pouch 状态图：系腰、案边、被手触碰、SHOT_13 转场；只允许一个 approved silhouette。
    costume: 固定在班超服装同一侧和相近高度，不随镜头漂移成军旅装备。
    continuity: 记录磨损、折痕、系带长度和与 Hero Brush 的装入方向。
    vfx: 如生成模型改变材质或附件，以 cleanup/replace 纠正，不新增装饰。
- flag_id: temporary_residence_layout
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_HHS47_BAN_CHAO
  - SRC_MET_EASTERN_HAN_HOUSE
  evidence_conclusion: 史料支持班超随母至洛阳并佣书养家，但不支持班氏住址、房间数量、家庭陈设或工作与居住是否同处。
  production_rule: 将剧本中的“班氏暂居处”在生产命名上改为“洛阳佣书复合空间（Composite Set）”：家庭压力通过母亲在阈限区、钱袋和对白进入，不展示住宅外景、卧具、厨房或完整家庭平面；不得宣传为班氏住宅复原。
  department_notes:
    writing_story: 场景合并保持[A/V]标记；不新增家庭史事实。
    director: 母亲不需要穿越完整住宅，只在同一视觉单元边缘完成情绪与信息功能。
    production_design: A工作区/B同僚区/C家庭阈限区可在同一复合布景内被 camera cheat，但连续性图必须固定。
    editorial: 通过 match on action、eyeline 和声音桥维持空间可信，不用额外 establishing shot 解释虚构平面。

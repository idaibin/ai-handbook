decisions:
- flag_id: room_architecture
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_HHS47_BAN_CHAO
  - SRC_MET_EASTERN_HAN_HOUSE
  evidence_conclusion: 时代建筑模型可支持“东汉普通建筑体量”的宽泛参照，但没有证据复原洛阳佣书室内。
  production_rule: 采用 composite_set（复合布景）和低细节普通室内：只锁定工作案、人物动线、一个画外/边缘采光开口；不锁定完整平面、斗拱、等级屋顶、彩画、宫殿陈设或具体洛阳建筑。
  department_notes:
    production_design: Set Plan 只画 A工作区/B同僚区/C家庭阈限区，不标注真实班氏住宅或官署名称。
    cinematography: 以中近景、插入镜头和有限景深减少未经证实的建筑曝光；建立镜头只说明劳动空间，不做城市复原。
    lighting: 使用 motivated soft side light，光源保持画外；可用 negative fill 塑造手部与面部，不显示不受支持的窗式。
    vfx: 仅做 invisible cleanup、伪文字和现代元素清理；不得扩建宏大洛阳背景。
- flag_id: shared_copying_space_layout
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_HHS47_BAN_CHAO
  - SRC_IHP_HAN_WOODEN_SLIPS_LIFECYCLE
  evidence_conclusion: 史料支持“为官佣书”及书写劳动，不支持共享抄书房、官署附属作坊或家庭内佣书的确定布局。
  production_rule: 把场景定义为“洛阳佣书复合空间”，而非历史复原；Blocking 固定为班超主工作轴、无名同僚侧后方低辨识度轴、母亲在家庭阈限/画面边缘。无机构牌匾、完整工位阵列或制度化作坊陈设。
  department_notes:
    director: 人物关系通过 blocking 和 eyeline 表达：班超被工作压住，同僚形成社会压力，母亲代表家庭责任。
    production_design: 空间只服务叙事功能，不声称真实制度空间。
    cinematography: Coverage 采用一张受控地理镜头、班超主近景、同僚反应和手部 inserts；不使用夸张广角展示未证平面。
    continuity: 固定三人的轴线、出入口方向和案面位置，Storyboard 时锁定 180-degree line。
- flag_id: early_eastern_han_clothing
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_MET_EASTERN_HAN_MAN
  - SRC_MET_EASTERN_HAN_WOMAN
  - SRC_NMC_EASTERN_HAN_TEXTILE_STONE
  evidence_conclusion: 东汉人物俑和纺织图像可提供时代轮廓、层叠衣着与织物存在的宽泛参照，但不能确定班超、班固、班母和佣书同僚的精确服制或发式。
  production_rule: 建立 Costume Plot v1：四人均为素朴层叠轮廓、低饱和灰褐色系、无官阶纹章；班超以磨损、墨迹和松弛层次表现劳作，班固更整洁但不穿后世官服，班母克制朴素，无名同僚保持低辨识度。发式只锁定稳定 silhouette，不宣称精确制度。
  department_notes:
    costume: 先做 silhouette/value test，再做细节；记录 Costume Continuity 和 ageing/distressing。
    hair_makeup: 四视图保持发际、发髻轮廓和面部结构一致；不加后世冠帽或华丽饰物。
    lighting: 在冷灰土褐 Show Look 下进行 costume camera test，确保人物依靠明度、磨损和轮廓区分而非高饱和颜色。
    director: 服装服务身份与处境，不把历史准确性转化为“更华丽”。
- flag_id: writing_surface_material
  decision: closed
  disposition: bounded_as_exploratory
  evidence_refs:
  - SRC_IHP_HAN_WRITING_EQUIPMENT
  - SRC_IHP_HAN_WOODEN_SLIPS_LIFECYCLE
  evidence_conclusion: 汉代书写工具和竹木简有直接出土证据；但材料多来自边塞，且不能证明班超在洛阳佣书时具体使用哪一种载体。
  production_rule: EP01 以无可读文字的窄幅竹/木质 slip-like surfaces 作为保守视觉表达；不使用现代纸张、册页、线装书或白色打印纸，不对竹/木种类、尺寸标准和班超个人使用作确定陈述。材料近景只表现墨线、磨损和工作量。
  department_notes:
    props: 制作/生成 Hero Writing Surface Sheet，包含正面、侧面、成束和散置状态；禁止可读正文。
    cinematography: ECU 只拍笔尖、墨线和手指，不让材质特写承担未经证实的考古陈述。
    editorial: wooden_slip_tap 作为节奏 cue，实际音色待 Foley/spotting，不在当前阶段生成。
    vfx: 清除伪文字和不一致的简牍数量。

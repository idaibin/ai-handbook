execution_rules:
- One asset ID per generation request; no multi-asset moodboard output.
- Character base turnarounds are prop-free; performance and hand-prop action sheets are separate.
- Every generated attempt is a Take with provider/model/version/input refs/time/cost/hash.
- Dailies review compares identity, costume, prop, camera/light and continuity before selection.
- No output becomes Canon through generation alone; G05 HOD approval remains required.
- No keyframe, motion, video or final audio generation in this work order.

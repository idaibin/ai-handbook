name: Visual Registry Next.js

on:
  push:
    branches: [main]
    paths:
      - "experiments/visual-registry-mvp-01/web/**"
      - ".github/workflows/visual-registry-nextjs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/visual-registry-mvp-01/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Next.js source boundary
        run: node scripts/validate-nextjs-source.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Assert export
        run: npm run assert:export

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: visual-registry-nextjs-out
          path: experiments/visual-registry-mvp-01/web/out
          if-no-files-found: error

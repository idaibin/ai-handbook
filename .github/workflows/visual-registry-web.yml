name: Visual Registry Web

on:
  push:
    paths:
      - "experiments/visual-registry-mvp-01/web/**"
      - ".github/workflows/visual-registry-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/visual-registry-mvp-01/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and static export
        run: npm run verify

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: visual-registry-web-out
          path: experiments/visual-registry-mvp-01/web/out
          if-no-files-found: error
          retention-days: 14

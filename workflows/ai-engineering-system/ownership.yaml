schema_version: "1.0"
repositories:
  idaibin/ai-handbook:
    role: learning_and_governance_control_plane
    owns:
      - source_catalog
      - research_queue
      - source_reading_evidence
      - knowledge_graph
      - experiments
      - application_cases
      - search_and_research_playbooks
      - workflow_governance
      - cross_repository_handoffs
      - promotion_and_deprecation_decisions
      - public_knowledge_schema_and_export
    does_not_own:
      - production_skill_packages
      - realtime_feed_records
      - large_private_source_files

  idaibin/feeds-hub:
    role: knowledge_and_intelligence_product
    owns:
      - feed_event_records
      - event_deduplication
      - feed_schema_and_validation
      - feed_presentation
      - ingestion_implementation
      - source_grounded_research_reports
      - source_grounded_insights
      - knowledge_candidate_event_identity
    does_not_own:
      - durable_knowledge_ir_promotion
      - authored_marketing_content
      - final_content_publishing
      - course_production
      - video_production
    routine_change_policy: write_data_using_current_contract
    architecture_change_triggers:
      - schema_change
      - new_ingestion_adapter
      - routing_or_presentation_change
      - storage_or_api_change

  idaibin/blog:
    role: public_static_knowledge_projection
    owns:
      - public_routes
      - bilingual_presentation
      - static_search_and_navigation
      - backlinks_and_local_graph_view
      - seo_rss_and_sitemap
      - public_changelog
      - redirects_and_canonical_urls
    does_not_own:
      - knowledge_evidence_and_promotion
      - private_handbook_state
      - realtime_feed_records
      - runtime_cross_repository_reads

  idaibin/knowledge-distillation:
    role: public_knowledge_output
    owns:
      - knowledge_ir
      - articles
      - courses
      - knowledge_cards
      - image_content_packages
      - video_content_packages
      - public_knowledge_assets
    may_emit:
      - skill_candidate_handoff
    does_not_own:
      - production_skill_implementation
      - project_runtime_validation

  idaibin/skills:
    role: executable_capability_layer
    owns:
      - trigger_and_non_trigger_contracts
      - executable_workflows
      - authority_boundaries
      - input_and_output_contracts
      - behavioral_evaluations
      - skill_release_status
    does_not_own:
      - bulk_source_catalogs
      - course_material
      - general_research_history

  idaibin/forgeway:
    role: product_delivery_system
    owns:
      - product_delivery_contracts
      - delivery_graph_and_artifact_identity
      - selected_visual_source_evidence
      - review_and_delivery_receipts
    does_not_own:
      - createway_content_artifacts
      - story_studio_ip_or_media_assets
      - target_repository_source_truth

  target_repository:
    role: project_fact_and_runtime_owner
    owns:
      - project_code
      - project_architecture
      - project_instructions
      - project_tests
      - target_runtime_evidence
      - deployment_evidence

product_systems:
  feeds-hub:
    route: knowledge-intelligence-system
    status: active_feed_research_insights_runtime_not_verified
    artifact_authority:
      - source_and_event_identity
      - feeds
      - source_grounded_research_reports
      - source_grounded_insights
      - knowledge_candidates
  createway:
    route: content-output-system
    status: architecture_defined_repository_not_created
    artifact_authority:
      - content_briefs_and_drafts
      - authored_publication_packages
      - content_view_styles
      - publication_receipts_and_feedback
  story-studio:
    route: media-production-system
    status: architecture_defined_runtime_not_verified
    artifact_authority:
      - ip_world_character_and_timeline
      - scripts_and_storyboards
      - continuity_references
      - visual_audio_media_masters
      - media_production_evidence
  forgeway:
    route: product-delivery-system
    status: active
    artifact_authority:
      - product_delivery_artifacts
      - verification_and_review_evidence
      - delivery_receipts

workspaces:
  chatgpt_work:
    role: research_orchestration_and_review
    canonical: false
  codex_cloud_or_local:
    role: repository_execution_and_testing
    canonical: false
  self_hosted_server:
    role: persistent_integration_environment
    canonical: false
  google_drive:
    role: raw_private_large_asset_storage
    canonical_for_binary_assets: true
  chatgpt_library:
    role: working_copy_and_snapshot
    canonical: false
  google_sheets:
    role: operational_view
    canonical: false

schema_version: "1.0"
eval_suite: ai_engineering_system_routing
workflow_version: 0.4.0
cases:
  - id: repository_deep_analysis_context
    input:
      type: github_repository_deep_analysis
    expected:
      always_load: operating-principles.md
      policy: source-management.md
      workflow: ../repository-research/README.md
      prompt: ../repository-research/prompts/deep-analysis.md
      load_unrelated_prompts: false

  - id: code_change_without_task_prompt
    input:
      type: project_change
      matching_prompt_present: false
    expected:
      always_load: operating-principles.md
      policy: delivery-recovery.md
      require_target_repository_instructions: true
      invent_or_reuse_unrelated_prompt: false

  - id: github_push_failure_after_validation
    input:
      type: external_write
      target: github
      operation: push
      result: failed
      verified_commit_present: true
    expected:
      export_git_bundle: true
      backup_owner: google_drive
      require_manifest_and_sha256: true
      remote_status: not_persisted
      claim_remote_delivery_complete: false

  - id: official_product_release
    input:
      type: realtime_event
      source_role: official
    expected:
      primary_owner: idaibin/feeds-hub
      preserve_research_reference_in: idaibin/ai-handbook
      modify_architecture: false

  - id: unverified_social_post
    input:
      type: community_signal
      corroborated: false
    expected:
      primary_owner: idaibin/ai-handbook
      status: discovered
      allowed_claim: unverified_signal
      publish_as_stable_fact: false

  - id: official_course_candidate
    input:
      type: learning_source
      read: false
    expected:
      primary_owner: idaibin/ai-handbook
      reading_status: unread
      verification_status: unverified
      route_to_knowledge_distillation: false

  - id: validated_course_card_content
    input:
      type: knowledge_output
      source_supported: true
      requested_output: course_card
    expected:
      primary_owner: idaibin/knowledge-distillation
      production_skill_owner: false

  - id: repeatable_executable_method
    input:
      type: executable_capability_candidate
      positive_cases_present: true
      negative_cases_present: true
      real_project_evidence_present: true
    expected:
      primary_owner: idaibin/skills
      initial_release_status: candidate
      automatic_stable_promotion: false

  - id: target_repository_code_change
    input:
      type: project_change
      target_repository: owner/repo
    expected:
      primary_owner: target_repository
      handbook_keeps: decision_and_evidence_reference

  - id: private_licensed_pdf
    input:
      type: source_asset
      access: private
      copyright_status: licensed_or_user_owned
    expected:
      binary_owner: google_drive
      metadata_owner: idaibin/ai-handbook
      public_raw_copy_allowed: false

  - id: google_sheets_write_failure
    input:
      type: external_write
      result: unauthorized_401
    expected:
      stop_new_claims: true
      stop_new_research_claims: true
      preserve_local_result: true
      require_reauthorization: true

  - id: verified_public_knowledge_node
    input:
      type: public_knowledge_projection
      visibility: public
      evidence_gate_passed: true
    expected:
      canonical_owner: idaibin/ai-handbook
      presentation_owner: idaibin/blog
      delivery_mode: build_time_pinned_snapshot
      automatic_publish: false

  - id: realtime_feed_knowledge_candidate
    input:
      type: realtime_event
      promoted: false
    expected:
      event_identity_owner: idaibin/feeds-hub
      research_candidate_owner: idaibin/ai-handbook
      public_blog_route: false
      automatic_handbook_source_write: false

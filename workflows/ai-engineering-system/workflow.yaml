schema_version: "0.2"
workflow:
  id: ai-engineering-lab-v0.2
  version: "0.2"
  status: frozen_pending_mvp_selection
  canonical_repository: idaibin/ai-handbook
  canonical_path: workflows/ai-engineering-system

legacy:
  version: "0.1"
  archived_at_commit: fb61beeac1ac18dba4fd064cdefd892f5b4052eb
  continuation_authorized: false

task_routing:
  execution_authorized: false
  purpose: legacy_identity_and_registry_consistency_only
  routes:
    knowledge-intelligence-system:
      owner: idaibin/feeds-hub
    content-output-system:
      owner: createway
    media-production-system:
      owner: story-studio
    product-delivery-system:
      owner: idaibin/forgeway

execution_gate:
  maximum_active_mvps: 1
  current_mvp: null
  requires_explicit_user_approval: true
  brief:
    maximum_pages: 1
    required_fields:
      - real_user_and_problem
      - smallest_usable_result
      - first_result_within_7_days
      - one_objective_metric
      - stop_condition

cycle:
  - problem
  - smallest_result
  - run
  - evidence
  - keep_change_or_stop

project_state:
  default: frozen
  unfreeze_to: active_mvp
  after_run: frozen_decision

prohibited_without_approved_mvp:
  - continue_legacy_task
  - generate_new_asset
  - modify_product_code
  - start_new_research
  - create_platform
  - create_general_registry
  - create_general_workflow
  - create_project
  - batch_research
  - batch_skill_creation

allowed_outputs_per_run:
  - mvp_brief
  - smallest_artifact
  - run_evidence
  - keep_change_or_stop_decision

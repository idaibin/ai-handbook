schema: story-studio/industrial-workflow
artifact_id: story-studio-industrial-workflow
status: authoritative
authority:
  stable_path: workflows/story-studio/film-department-gate-matrix-v1.yaml
  change_policy: direct_replace_stable_path_no_parallel_v2_v3_files
  purpose: Canonical workflow for AI drama and animation production. Models are tools or vendors, not departments or approvers.
  companion_artifacts:
  - workflows/story-studio/core-glossary.yaml
  - workflows/story-studio/stage-artifact-matrix.yaml
  - workflows/story-studio/role-approval-matrix.yaml
  - workflows/story-studio/conditional-modules.yaml
scope:
  applies_to:
  - AI drama
  - AI animation
  - hybrid animation/live-action planning
  - historical or fictional narrative projects
  does_not_claim: A single universal studio pipeline. Department names may vary by studio, but responsibilities and gates must remain represented.
operating_principles:
- The director owns creative intent; models and providers execute bounded tasks.
- Every stage returns inspectable artifacts, not only prompts.
- A creator, model or agent cannot generate, review and approve the same artifact without an explicit exception record.
- Storyboard, layout, previs/techvis and timed animatic precede expensive shot production.
- Candidate assets remain non-canonical until the required approval gate passes.
- GenerationAttempt is the Story Studio equivalent of a take; DailiesReview chooses Selects.
- Picture Lock precedes final VFX turnover, conform, colour finishing and final mix.
- Historical fact, inference, adaptation and fiction remain separate from visual preference.
- Rights, provider identity, provenance, lineage, cost and run metadata are production controls.
- 'The workflow is iterative: failed gates return to a named upstream artifact, not to an undefined redesign loop.'
content_hierarchy:
- level: 1
  term: Project
  meaning: Production workspace and governance boundary.
- level: 2
  term: Series
  meaning: Whole continuing work and its long-term narrative/production rules.
- level: 3
  term: ChapterOrSeason
  meaning: Major story division containing multiple episodes.
- level: 4
  term: Episode
  meaning: Single delivery unit.
- level: 5
  term: Sequence
  meaning: Group of scenes serving one dramatic movement or production unit.
- level: 6
  term: Scene
  meaning: Continuous dramatic unit, usually bounded by place and time.
- level: 7
  term: Beat
  meaning: Smallest meaningful change in objective, information, emotion or power.
- level: 8
  term: Shot
  meaning: Single planned continuous camera view in the edit.
- level: 9
  term: Take
  meaning: One generated or recorded attempt for a fixed Shot Contract.
macro_stages:
- stage_id: STAGE_01_DEVELOPMENT_GREENLIGHT
  name_en: Development & Greenlight
  name_zh: 项目开发与立项
  purpose: Define premise, theme, audience, scope, format, distribution, evidence policy, budget and rights posture.
  entry_gate: null
  exit_gate: G01_DEVELOPMENT_GREENLIGHT
- stage_id: STAGE_02_NARRATIVE_SCRIPT_LOCK
  name_en: Narrative Bible & Script Lock
  name_zh: 叙事圣经与剧本锁定
  purpose: Lock narrative rules, story structure, character arcs, scene/beat IDs, screenplay timing and scratch dialogue needs.
  entry_gate: G01_DEVELOPMENT_GREENLIGHT
  exit_gate: G02_SCRIPT_LOCK
- stage_id: STAGE_03_HOD_BREAKDOWN_PLANNING
  name_en: HOD Breakdown & Production Planning
  name_zh: 部门拆解与制片规划
  purpose: Break the locked script into department-owned assets, shots, sound, VFX, action, schedule, budget and risks.
  entry_gate: G02_SCRIPT_LOCK
  exit_gate: G03_HOD_BREAKDOWN_COMPLETE
- stage_id: STAGE_04_RESEARCH_RIGHTS_CONSTRAINTS
  name_en: Research, Rights & Design Constraints
  name_zh: 考据、权利与设计边界
  purpose: Resolve, bound, exclude or defer uncertain historical, legal, provider and design elements.
  entry_gate: G03_HOD_BREAKDOWN_COMPLETE
  exit_gate: G04_RESEARCH_RIGHTS_CONSTRAINTS_LOCK
- stage_id: STAGE_05_VISDEV_LOOKDEV_APPROVAL
  name_en: Visual Development, LookDev & Design Approval
  name_zh: 视觉开发、外观开发与设计批准
  purpose: Approve character, environment, costume, prop, material, palette, lighting language and Show Look.
  entry_gate: G04_RESEARCH_RIGHTS_CONSTRAINTS_LOCK
  exit_gate: G05_DESIGN_LOOK_APPROVAL
- stage_id: STAGE_06_STORYBOARD_LAYOUT_ANIMATIC
  name_en: Storyboard, Layout, Previs, Techvis & Animatic
  name_zh: 故事板、布局、预演、技术预演与动态分镜
  purpose: Prove screen geography, blocking, coverage, eyelines, timing, scratch audio, technical feasibility and total duration at low cost.
  entry_gate: G05_DESIGN_LOOK_APPROVAL
  exit_gate: G06_TIMED_ANIMATIC_LOCK
- stage_id: STAGE_07_ASSET_BUILD_TECH_VALIDATION
  name_en: Asset Build & Technical Validation
  name_zh: 资产制作与技术验证
  purpose: Create production-ready asset versions and prove identity, camera, lighting, motion, provider and technical reproducibility.
  entry_gate: G06_TIMED_ANIMATIC_LOCK
  exit_gate: G07_ASSET_PRODUCTION_READINESS
- stage_id: STAGE_08_SHOT_PRODUCTION_DAILIES
  name_en: Shot Production, Dailies & Selects
  name_zh: 镜头生产、样片审查与选片
  purpose: Generate or record Takes against locked Shot Contracts, review Dailies and select approved material for editorial.
  entry_gate: G07_ASSET_PRODUCTION_READINESS
  exit_gate: G08_SHOT_SELECT_APPROVAL
- stage_id: STAGE_09_EDITORIAL_PICTURE_LOCK
  name_en: Editorial & Picture Lock
  name_zh: 剪辑与画面锁定
  purpose: Build assembly, rough cut and fine cut; lock shot order, duration and turnover handles.
  entry_gate: G08_SHOT_SELECT_APPROVAL
  exit_gate: G09_PICTURE_LOCK
- stage_id: STAGE_10_FINISH_DELIVERY_ARCHIVE
  name_en: Finish, QC, Delivery & Archive
  name_zh: 后期完成、质检、交付与归档
  purpose: Complete VFX, conform, colour, final voice, sound design, score, mix, subtitles, accessibility, master QC, delivery and archive.
  entry_gate: G09_PICTURE_LOCK
  exit_gate: G11_MASTER_DELIVERY_APPROVAL
quality_gates:
- gate_id: G01_DEVELOPMENT_GREENLIGHT
  decision_owner: production_management
  pass_meaning: Project scope, audience, format, budget, evidence and rights posture are explicit.
- gate_id: G02_SCRIPT_LOCK
  decision_owner: directing
  pass_meaning: Narrative causality, scene/beat IDs, duration and scratch dialogue needs are viable.
- gate_id: G03_HOD_BREAKDOWN_COMPLETE
  decision_owner: production_management
  pass_meaning: Every required department has owned artifacts, dependencies, schedule and open questions.
- gate_id: G04_RESEARCH_RIGHTS_CONSTRAINTS_LOCK
  decision_owner: research_rights_panel
  pass_meaning: Every uncertain element is evidence-supported, bounded, excluded or deferred; usage posture is recorded.
- gate_id: G05_DESIGN_LOOK_APPROVAL
  decision_owner: directing_design_camera_panel
  pass_meaning: Versioned design approvals and Show Look exist; references alone do not pass.
- gate_id: G06_TIMED_ANIMATIC_LOCK
  decision_owner: directing_editorial_panel
  pass_meaning: Storyboard/Layout/Animatic prove screen geography, timing, scratch sound and total duration.
- gate_id: G07_ASSET_PRODUCTION_READINESS
  decision_owner: technical_hod_panel
  pass_meaning: Assets reproduce under camera, lighting, identity, continuity and provider tests.
- gate_id: G08_SHOT_SELECT_APPROVAL
  decision_owner: director_editor
  pass_meaning: A Select meets performance, camera, continuity, technical and rights requirements; repeated per shot or sequence.
- gate_id: G09_PICTURE_LOCK
  decision_owner: director_editor_producer
  pass_meaning: Shot order and timing are locked; later structural change requires change control and re-turnover.
- gate_id: G10_FINISH_APPROVAL
  decision_owner: post_supervisor_director
  pass_meaning: VFX finals, conform, colour and sound finals match the locked timeline and approved look.
- gate_id: G11_MASTER_DELIVERY_APPROVAL
  decision_owner: production_qc_rights
  pass_meaning: Technical, content, rights, accessibility, provenance and delivery QC pass.

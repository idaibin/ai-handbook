schema: story-studio/core-glossary
artifact_id: story-studio-core-glossary
status: authoritative
authority:
  stable_path: workflows/story-studio/core-glossary.yaml
  change_policy: direct_replace_stable_path_no_parallel_version_files
  language_rule: English term is the canonical identifier; Chinese is the required explanatory label.
  usage_rule: Contracts use canonical terms; prose may show both languages.
term_classes:
  industry_standard: Widely established across film, animation, VFX, editorial or sound.
  industry_common: Common but studio boundaries may vary.
  studio_common: Used by some studios or departments, not universal.
  story_studio_defined: Internal Story Studio governance term; industry equivalents must be stated where relevant.
  provider_specific: Defined by a model or platform provider and not portable by default.
controlled_vocabularies:
  review_decision:
  - approve
  - revise
  - reject
  - blocked
  - defer
  lifecycle_state:
  - draft
  - candidate
  - selected_component
  - canonical
  - production_ready
  - publication_ready
  - superseded
  - retired
  - rejected
  evidence_class:
  - fact
  - inference
  - adaptation
  - fiction
  - not_verified
terms:
  Project:
    zh: 项目
    class: industry_common
    definition: 生产范围、资产和治理的工作空间
    cannot_mean: 单集或散乱文件夹
  Series:
    zh: 系列
    class: industry_standard
    definition: 由长期叙事和生产规则约束的完整连续作品
    cannot_mean: 单集
  ChapterOrSeason:
    zh: 篇章或季
    class: industry_common
    definition: 包含多集的主要故事分区
    cannot_mean: Scene 或 Sequence
  Episode:
    zh: 集
    class: industry_standard
    definition: 系列中的单个交付单元
    cannot_mean: Scene 或 Shot
  Sequence:
    zh: 段落或序列
    class: industry_standard
    definition: 服务同一戏剧运动的一组 Scene 或 Shot
    cannot_mean: 单个连续 Scene
  Scene:
    zh: 场
    class: industry_standard
    definition: 通常由时间和地点限定的连续戏剧单元
    cannot_mean: 可复用 Location 资产
  Location:
    zh: 地点资产
    class: industry_common
    definition: 可在多个 Scene 中复用的地理或环境实体
    cannot_mean: Scene
  Beat:
    zh: 剧情节拍
    class: industry_standard
    definition: 一次信息、情绪、目标或力量关系的变化
    cannot_mean: Shot
  Shot:
    zh: 镜头
    class: industry_standard
    definition: 一次连续摄影或动画表达单元
    cannot_mean: Take
  Take:
    zh: 条次或生成尝试
    class: industry_standard
    definition: 同一 Shot 合同下的一次候选执行
    cannot_mean: 已选择的 Select
  Premise:
    zh: 故事命题
    class: industry_standard
    definition: 角色在特定条件下行动将产生什么结果的核心假设
    cannot_mean: Theme 或 Logline
  Logline:
    zh: 一句话梗概
    class: industry_standard
    definition: 主角、目标、阻力和风险的高密度概述
    cannot_mean: Treatment
  Theme:
    zh: 主题
    class: industry_standard
    definition: 作品持续探讨的抽象问题
    cannot_mean: 题材或口号
  ValueConflict:
    zh: 价值冲突
    class: story_studio_defined
    definition: 两种都具有意义但不能同时完全满足的价值拉扯
    cannot_mean: 简单善恶对立
  CharacterArc:
    zh: 人物弧
    class: industry_standard
    definition: 人物状态、价值判断和行动方式跨故事发生的变化
    cannot_mean: 人物生平清单
  DramaticObjective:
    zh: 戏剧目标
    class: industry_standard
    definition: 角色在 Scene 或 Beat 中试图实现的具体结果
    cannot_mean: 作者主题
  Obstacle:
    zh: 阻力
    class: industry_standard
    definition: 阻止角色完成目标的力量
    cannot_mean: 任意背景困难
  Turn:
    zh: 转折
    class: industry_standard
    definition: 改变当前策略、信息或力量关系的不可逆变化
    cannot_mean: 每个镜头切换
  Treatment:
    zh: 剧情处理稿
    class: industry_standard
    definition: 以散文方式完整说明剧情、人物变化和主要场面
    cannot_mean: Screenplay
  Screenplay:
    zh: 剧本
    class: industry_standard
    definition: 由 Scene、Action、Character、Dialogue 和必要声音信息组成的执行文本
    cannot_mean: Treatment、Storyboard 或 GenerationPrompt
  ScriptLock:
    zh: 剧本锁定
    class: industry_common
    definition: Screenplay 的因果、时长、对白和证据边界已获批准
    cannot_mean: 没有变更控制的草稿
  TableRead:
    zh: 剧本围读
    class: industry_standard
    definition: 通过实际朗读测试对白、角色和节奏
    cannot_mean: 静态字数统计
  ScriptBreakdown:
    zh: 剧本拆解
    class: industry_standard
    definition: 从 Screenplay 提取角色、Location、Set、Costume、Prop、VFX、Sound 和排期需求
    cannot_mean: 剧情摘要
  StoryBible:
    zh: 故事 Bible
    class: industry_common
    definition: 故事事实、主题、人物关系、时间线和长期规则的权威输入
    cannot_mean: 单集 Screenplay
  WorldBible:
    zh: 世界 Bible
    class: industry_common
    definition: 世界的政治、地理、制度、物质文化、交通和生活规则
    cannot_mean: Environment Concept
  CharacterBible:
    zh: 人物 Bible
    class: industry_common
    definition: 角色身份、目标、矛盾、关系、表演与连续性规则
    cannot_mean: 单张 CharacterBlueprint
  ProductionBible:
    zh: 生产 Bible
    class: story_studio_defined
    definition: 将叙事规则转换为摄影、美术、灯光、声音、动作和连续性约束
    cannot_mean: 普通 WorldBible
  NarrativeCanon:
    zh: 叙事权威
    class: story_studio_defined
    definition: 项目内部批准的故事事实、人物和时间线
    cannot_mean: 历史事实本身
  VisualCanon:
    zh: 视觉权威
    class: story_studio_defined
    definition: 经 HOD 审批的视觉规则与 Anchor Asset
    cannot_mean: 好看的候选图
  ProductionCanon:
    zh: 生产执行权威
    class: story_studio_defined
    definition: 当前锁定的 Screenplay、Shot、Storyboard、Animatic 和批准媒体版本
    cannot_mean: NarrativeCanon
  VisualDevelopment:
    zh: 视觉开发
    class: industry_standard
    definition: 探索世界、角色、构图、色彩和形状语言
    cannot_mean: Final Design Approval
  LookDevelopment:
    zh: LookDev
    class: industry_standard
    definition: 探索并测试材质、色彩、灯光、摄影和最终视觉表现
    cannot_mean: 单张候选图
  Styleframe:
    zh: 风格帧
    class: industry_common
    definition: 用于验证项目最终画面语言的代表性单帧
    cannot_mean: ShotKeyframe 或 MarketingArt
  ColorScript:
    zh: 色彩脚本
    class: industry_standard
    definition: 随剧情推进规划颜色、明度、对比和情绪变化
    cannot_mean: 调色预设
  ShowLook:
    zh: 项目视觉基准
    class: studio_common
    definition: Dailies 和最终调色共同参照的版本化观看目标
    cannot_mean: 单一 LUT 或滤镜
  ReferenceAsset:
    zh: 参考资产
    class: story_studio_defined
    definition: 规定人物、Location、Prop 或风格但不属于具体 Shot 的素材
    cannot_mean: ShotKeyframe
  CharacterBlueprint:
    zh: 人物蓝图
    class: story_studio_defined
    definition: 稳定角色脸型、身体、服装层级和多视图结构的设计资产
    cannot_mean: CharacterCanon 自动批准
  Turnaround:
    zh: 转面图
    class: industry_standard
    definition: 同一角色或物体的一组一致视角
    cannot_mean: 多个不同设计拼图
  CostumePlot:
    zh: 服装状态表
    class: industry_standard
    definition: 角色在时间、身份和 Scene 之间的服装变化计划
    cannot_mean: 单套服装概念图
  SetPlan:
    zh: 布景平面与空间计划
    class: industry_common
    definition: Set 的区域、入口、Blocking 和摄影关系
    cannot_mean: 历史建筑复原声明
  HeroProp:
    zh: 核心道具
    class: industry_standard
    definition: 对叙事和连续性具有重要作用、需要更高控制级别的道具
    cannot_mean: 任意背景物件
  Blocking:
    zh: 人物调度
    class: industry_standard
    definition: 人物在空间中的位置、移动和关系
    cannot_mean: CameraMovement
  Staging:
    zh: 场面调度
    class: industry_standard
    definition: 组织角色、空间、动作和视觉重点以表达戏剧信息
    cannot_mean: Set dressing
  Coverage:
    zh: 镜头覆盖
    class: industry_standard
    definition: 为剪辑提供 Master、Two-shot、Close-up、Insert 和 Reaction 等必要镜头组合
    cannot_mean: 越多镜头越好
  ShotList:
    zh: 镜头表
    class: industry_standard
    definition: 结构化记录 Shot ID、时长、景别、动作、Camera 和依赖
    cannot_mean: Storyboard
  Storyboard:
    zh: 故事板
    class: industry_standard
    definition: 以连续画格表达构图、动作、Eyeline 和剪辑关系
    cannot_mean: ShotList 或 Animatic
  Layout:
    zh: 镜头布局
    class: industry_standard
    definition: 在 Storyboard 后建立 Camera、Lens、Set、Blocking 和粗略动作的空间版本
    cannot_mean: ProductionDesign SetPlan
  Previs:
    zh: 预演
    class: industry_common
    definition: 低成本验证 Blocking、Camera、节奏和 Sequence 逻辑
    cannot_mean: Final Shot
  Techvis:
    zh: 技术预演
    class: industry_common
    definition: 验证 Camera、Motion、VFX、Provider 和输入输出可行性
    cannot_mean: 纯视觉 Moodboard
  Animatic:
    zh: 动态故事板
    class: industry_standard
    definition: 按真实时长将 Storyboard、ScratchAudio 和临时转场剪成可播放时间线
    cannot_mean: Video Final
  ShotContract:
    zh: 镜头合同
    class: story_studio_defined
    definition: 固定一个 Shot 的叙事、Camera、Lighting、Asset、Motion、Audio 和验收条件
    cannot_mean: Prompt
  ShotKeyframe:
    zh: 镜头关键帧
    class: story_studio_defined
    definition: 绑定具体 Shot 的批准视觉锚点
    cannot_mean: ReferenceAsset 或 AnimationKeyframe
  AnimationKeyframe:
    zh: 动画关键帧
    class: industry_standard
    definition: 定义动画属性在时间点上的值
    cannot_mean: ShotKeyframe
  Handles:
    zh: 剪辑余量
    class: industry_standard
    definition: 正式动作前后保留的额外帧或秒数
    cannot_mean: Shot 正式时长
  GenerationAttempt:
    zh: 生成尝试
    class: story_studio_defined
    definition: 固定合同下的一次 Provider 输出与完整运行记录
    cannot_mean: Select 或 Canonical
  DailiesOrRushes:
    zh: 日样审查
    class: industry_standard
    definition: 对当批 Take 进行创作、连续性和技术评审
    cannot_mean: Gate 自动通过
  Select:
    zh: 入选条次
    class: industry_standard
    definition: 被导演和剪辑选择进入当前 Cut 的 Take
    cannot_mean: Final Shot 或 Canonical Asset
  PictureLock:
    zh: 画面锁定
    class: industry_standard
    definition: Shot 顺序、时长和转场获批准，后续修改进入变更控制
    cannot_mean: 导出预览
  VFXTurnover:
    zh: VFX 交接
    class: industry_standard
    definition: 将锁定 Plate、Handles、Mask、Camera 数据、Reference 和说明交给 VFX
    cannot_mean: 一句修图要求
  Conform:
    zh: 套底
    class: industry_standard
    definition: 将锁定剪辑重新关联到批准的高质量媒体版本
    cannot_mean: 普通重新导出
  SpottingSession:
    zh: 声音与音乐定位会
    class: industry_standard
    definition: 决定 Dialogue、Ambience、Foley、SFX 和 Score 的位置与功能
    cannot_mean: 自动配乐
  Foley:
    zh: 拟音
    class: industry_standard
    definition: 为动作和物件重新表演或制作同步声音
    cannot_mean: 所有 SFX
  ADR:
    zh: 后期对白补录
    class: industry_standard
    definition: 对对白进行后期重录或修复
    cannot_mean: ScratchDialogue
  Master:
    zh: 成片母版
    class: industry_standard
    definition: 通过 Picture、Sound、Rights 和技术 QC 的交付文件
    cannot_mean: 预览导出
  Archive:
    zh: 归档
    class: industry_standard
    definition: 保存可重读的源、版本、权利、血缘和交付证据
    cannot_mean: 临时目录
  candidate:
    zh: 候选
    class: story_studio_defined
    definition: 可评审但未成为权威的 Artifact 或媒体
    cannot_mean: canonical
  selected_component:
    zh: 入选成分
    class: story_studio_defined
    definition: 某个资产中允许复用的局部特征
    cannot_mean: 整体资产批准
  canonical:
    zh: 内部权威
    class: story_studio_defined
    definition: 项目内部经批准、后续必须遵守的版本
    cannot_mean: production_ready 或 publication_ready
  production_ready:
    zh: 可投入生产
    class: story_studio_defined
    definition: Canonical 且通过 Camera、Lighting、Motion、Continuity、Provider 和技术测试
    cannot_mean: publication_ready
  publication_ready:
    zh: 可公开发布
    class: story_studio_defined
    definition: 已满足 Rights、Attribution、Content、Technical 和 Distribution Gate 的状态
    cannot_mean: canonical
  fact:
    zh: 事实
    class: story_studio_defined
    definition: 有直接来源支持的陈述
    cannot_mean: 视觉偏好
  inference:
    zh: 推断
    class: story_studio_defined
    definition: 由证据支持但来源未直接写明的推论
    cannot_mean: fact
  adaptation:
    zh: 改编
    class: story_studio_defined
    definition: 为叙事和生产进行的合并、压缩、重排或视觉处理
    cannot_mean: 历史事实
  fiction:
    zh: 虚构
    class: story_studio_defined
    definition: 明确创造且不冒充史实的内容
    cannot_mean: inference
  CreativeBrief:
    zh: 创意简报
    class: industry_common
    definition: 在 Greenlight 前固定受众、目的、范围、格式、发行、成功标准和非目标的开发输入
    cannot_mean: 完整 StoryBible 或 ProductionPlan
  SeriesFormatContract:
    zh: 系列格式合同
    class: story_studio_defined
    definition: 对整个 Series 生效的画幅、分辨率、时长范围、帧率和派生格式权威
    cannot_mean: 单个 Episode 临时输出设置
  PremiseLoglineTheme:
    zh: 命题、故事概述与主题包
    class: story_studio_defined
    definition: 将 Premise、Logline、Theme 与 ValueConflict 作为同一 Greenlight Artifact 管理
    cannot_mean: Treatment 或宣传文案
  SourceLedger:
    zh: 来源台账
    class: industry_common
    definition: 以稳定 Source ID 记录来源、版本、定位、支持范围、限制及 Claim 映射
    cannot_mean: 只有链接的参考资料清单
  BudgetScheduleRiskRegister:
    zh: 预算、排期与风险登记
    class: story_studio_defined
    definition: 记录预算权限、阶段顺序、资源配额、风险、Owner、缓解措施和停止条件
    cannot_mean: 没有执行约束的愿望清单
  RightsPosture:
    zh: 权利立场
    class: story_studio_defined
    definition: 当前允许的使用范围及其阻塞条件，例如 internal_candidate_only
    cannot_mean: 法律保证或 PublicationReady
  SeriesCreativeConstitution:
    zh: 系列创作宪章
    class: story_studio_defined
    definition: 固定 Series 的创作目的、主题、价值冲突、基调、叙事承诺和禁止项
    cannot_mean: 新增故事内容或宣传口号集合
  NarrativeBible:
    zh: 叙事权威 Bible
    class: story_studio_defined
    definition: 整合 StoryBible、WorldBible、CharacterBible 与 Series Arc 的当前 NarrativeCanon 输入
    cannot_mean: 未审批的 Research Draft 或 Episode Treatment
  FactInferenceAdaptationFictionMatrix:
    zh: 事实、推断、改编、虚构矩阵
    class: story_studio_defined
    definition: 把关键 Claim 分类并关联 Source、使用范围和禁用陈述
    cannot_mean: 模糊免责声明
  SceneBeatIndex:
    zh: 场与节拍索引
    class: story_studio_defined
    definition: 以稳定 Scene ID 与 Beat ID 连接 Screenplay、Shot、Character State 和部门意图
    cannot_mean: ShotList
  TimingReadScratchDialoguePlan:
    zh: 时长朗读与临时对白计划
    class: story_studio_defined
    definition: 记录文本计时方法、对白长度、停顿余量、临时声音方案和未完成的真人/合成朗读测试
    cannot_mean: Final Voice 或 Final Mix
  AssetRequirementList:
    zh: 资产需求清单
    class: industry_common
    definition: 从已锁定 Script 与 Shot 计划提取所需角色、Location、Set、Costume、Prop、VFX 和 Audio 资产
    cannot_mean: 所有可能想生成的素材
  ShotPlanningBaseline:
    zh: 镜头规划基线
    class: story_studio_defined
    definition: 在 Storyboard 前固定 Shot ID、时长、戏剧功能、Coverage、资产和部门依赖的规划输入
    cannot_mean: Storyboard 或 PictureLock
  DepartmentBreakdowns:
    zh: 部门拆解包
    class: industry_common
    definition: 各 HOD 对 Scene、Beat、Shot 的需求、风险、输入和交付拆解
    cannot_mean: 单一通用 Prompt
  ProductionPlan:
    zh: 生产计划
    class: industry_standard
    definition: 定义阶段顺序、排期、责任、Review Cadence、资源与停止条件
    cannot_mean: 只有日期的日历
  DependencyAndRiskMap:
    zh: 依赖与风险图
    class: story_studio_defined
    definition: 将 Artifact、Gate、Provider、资产与风险之间的前置和传播关系结构化
    cannot_mean: 一般性风险清单
  RightsLedger:
    zh: 权利台账
    class: industry_common
    definition: 逐项记录 Input、Output、Provider、条款快照、允许用途、限制和未验证项
    cannot_mean: 仅凭 Output Ownership 推断可公开发行
  ProviderProvenancePolicy:
    zh: Provider 与来源追踪政策
    class: story_studio_defined
    definition: 规定 Provider、请求模型、有效模型、设置、输入引用、时间、成本和 Hash 的记录要求
    cannot_mean: 模型营销名称
  AdaptationExceptionLog:
    zh: 改编例外日志
    class: story_studio_defined
    definition: 记录偏离史料或 ProductionBible 的例外、理由、范围、批准人与受影响 Artifact
    cannot_mean: 把未知项静默当作事实
  DesignConstraintRegister:
    zh: 设计约束登记
    class: story_studio_defined
    definition: 将历史、叙事、格式、摄影、灯光、材质和禁用元素转换为可验证设计规则
    cannot_mean: Moodboard
  DirectorTreatment:
    zh: 导演阐述
    class: industry_common
    definition: 导演对叙事重点、表演、节奏、Blocking、Coverage 和视听策略的可执行说明
    cannot_mean: Screenplay 重写
  ProductionDesignBible:
    zh: 美术设计 Bible
    class: industry_common
    definition: 规定 Set、Location、空间、材质、色彩、陈设和视觉层级的生产规则
    cannot_mean: 单张 Environment Concept
  LookBookAndStyleframes:
    zh: 视觉参考册与风格帧
    class: story_studio_defined
    definition: 将 LookBook 规则与经评审的 Styleframe 组织为共同视觉输入
    cannot_mean: 未经审查的候选图片拼贴
  CameraLightingTests:
    zh: 摄影与灯光测试
    class: story_studio_defined
    definition: 在共同 Character、Set、Prop 与 ShowLook 下验证 Lens、Exposure、Light Direction、Value Separation 和连续性
    cannot_mean: 单张漂亮参考图
  VisualCanonDecision:
    zh: 视觉权威决定
    class: story_studio_defined
    definition: 以 Gate ID 和 approve/revise/reject/blocked/defer 对视觉规则与 Anchor Asset 作版本化决定
    cannot_mean: 生成成功或 selected_component
  CharacterCostumePropDesigns:
    zh: 角色、服装与道具设计包
    class: story_studio_defined
    definition: 经共同历史、摄影、灯光和连续性约束组织的 Character、Costume、Hair/Makeup 与 Prop 设计
    cannot_mean: 只有人物脸图
  RightsAndProvenanceGate:
    zh: 权利与来源门禁
    class: story_studio_defined
    definition: 确认当前使用范围、条款快照、输入权利和 Provider 记录达到阶段要求
    cannot_mean: 法律意见或永久授权
  ApprovalRequest:
    zh: 审批请求
    class: story_studio_defined
    definition: 提交给指定 Approver 的 Artifact、证据、未决项与允许决定集合
    cannot_mean: 自动 approve
  NarrativeToProductionBridge:
    zh: 叙事到生产桥接
    class: story_studio_defined
    definition: 把 Scene/Beat 的目标、转折、人物状态与摄影、美术、灯光、声音、VFX、连续性和 Shot 连接起来的结构化 Artifact
    cannot_mean: Screenplay、ShotList 或通用 Prompt
  BlockingCoveragePlan:
    zh: 调度与镜头覆盖计划
    class: story_studio_defined
    definition: 在 Storyboard 前固定人物空间、轴线、Eyeline、Screen Direction 和必要 Coverage 的计划
    cannot_mean: 最终 Storyboard 或越多镜头越好
  StoryboardBrief:
    zh: 故事板制作简报
    class: story_studio_defined
    definition: 逐 Shot 规定 Panel 数量、构图、动作阶段、Camera、Audio、Continuity 和禁止项的文字输入
    cannot_mean: Storyboard Panel 本身
  LayoutPrevisTechvisPlan:
    zh: Layout、预演与技术预演计划
    class: story_studio_defined
    definition: 规定灰盒空间、Camera 数据、代理角色、Previs 时间线和技术风险验证方法
    cannot_mean: 已完成 Layout、Previs 或 Techvis
  ScratchAudioPlan:
    zh: 临时声音计划
    class: story_studio_defined
    definition: 规定 Animatic 用临时对白、环境、拟音占位、音频格式和时间锚点
    cannot_mean: Final Voice、ADR 或 Final Mix
  TechnicalFormatDecision:
    zh: 技术格式决定
    class: story_studio_defined
    definition: 固定画幅、分辨率、帧率、Timecode、音频采样率、位深和 Review Proxy 的项目决定
    cannot_mean: Provider 默认设置或最终平台交付规范
  StoryboardEntryDecision:
    zh: 分镜阶段进入决定
    class: story_studio_defined
    definition: 明确文本前置、视觉门禁、未完成项和是否允许进入 Storyboard 执行的 Gate Decision
    cannot_mean: 文本写完即自动进入分镜
  StoryboardPanel:
    zh: 故事板画格
    class: industry_standard
    definition: 一个 Shot 内用于表达构图、动作阶段、Eyeline、Camera 和剪辑关系的单个画格
    cannot_mean: Styleframe、ShotKeyframe 或最终画面
ambiguous_or_deprecated_labels:
  脚本:
    use:
    - Screenplay
    - Storyboard Script
    - Generation Prompt
    - Automation Script
    rule: 必须指明文件类型
  场景:
    use:
    - Scene
    - Location
    - Set
    - Environment Asset
    rule: 戏剧单元用 Scene，可复用空间用 Location 或 Set
  分镜:
    use:
    - ShotList
    - Storyboard
    - Animatic
    rule: 必须区分文字镜头表、视觉面板和有时长视频
  关键图片:
    use:
    - ReferenceAsset
    - Styleframe
    - Storyboard Panel
    - ShotKeyframe
    - Marketing Art
    rule: 合同中禁止使用模糊标签
  关键帧:
    use:
    - ShotKeyframe
    - AnimationKeyframe
    rule: 区分镜头视觉锚点和时间轴关键帧
  审核通过:
    use:
    - gate_id + approve/revise/reject/blocked/defer
    rule: 必须记录 Gate、决定和 Approver
  最终版:
    use:
    - canonical
    - production_ready
    - picture_locked
    - master_approved
    - publication_ready
    rule: 必须声明准确状态
sources:
- https://www.screenskills.com/starting-your-career/career-maps/
- https://disneyanimation.com/process-encanto/
- https://www.adobe.com/de/creativecloud/animation/discover/animatics.html
- https://www.screenskills.com/job-profiles/browse/post-production/
ambiguous_label_rules:
  脚本: Screenplay | StoryboardScript | GenerationPrompt | AutomationScript
  场景: Scene | Location | Set | EnvironmentAsset
  分镜: ShotList | Storyboard | Animatic
  关键图片: ReferenceAsset | Styleframe | StoryboardPanel | ShotKeyframe | MarketingArt
  关键帧: ShotKeyframe | AnimationKeyframe
  审核通过: gate_id + approve/revise/reject/blocked/defer
  最终版: canonical | production_ready | picture_locked | master_approved | publication_ready
